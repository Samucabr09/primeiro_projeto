<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Escola Cívico Militar Leonardo Da Vinci</title>

    <link rel="stylesheet" href="formulario.css">

    <link rel="shortcut icon" type="image/ico" 
          href="imagens/logo-civico-militar.png">
</head>

<body>

<header>

    <div class="caixa">

        <!-- LOGO -->
        <img src="imagens/logo-leonardo.png" 
             alt="Logo Escola Cívico Militar Leonardo Da Vinci">

        <!-- TEXTOS -->
        <div class="texto">

            <h1>COLÉGIO ESTADUAL LEONARDO DA VINCI</h1>

            <h2>
                Ensino Fundamental, Médio, Normal e Profissional
            </h2>

            <h3>
                Av. Salgado Filho, 175 - Centro Sul |
                Fone (46) 3536-2334
                <br>
                E-mail: dvzleonardodavinci@seed.pr.gov.br
            </h3>

            <h2 class="h22">CEP 85.660-000 DOIS VIZINHOS PARANÁ</h2>

        </div>

    </div>

</header>
<h2 class="ficha1">I - FICHA DE INSCRIÇÃO</h2>

<form class="formulario">
    <label>Nome:</label>
    <input type="text" name="nome" required><br><br>

    <label>RG:</label>
    <input type="text" name="rg">
    <label>Expedido por:</label>
    <input type="text" name="orgao">
    <label>CPF:</label>
    <input type="text" name="cpf"><br><br>

    <label>Data de nascimento:</label>
    <input type="date" name="nascimento"><br><br>

    <label>Endereço:</label>
    <input type="text" name="endereco">
    <label>N°:</label>
    <input type="text" name="numero"><br><br>

    <label>Bairro:</label>
    <input type="text" name="bairro">
    <label>Município:</label>
    <input type="text" name="municipio">
    <label>UF:</label>
    <input type="text" name="uf" maxlength="2"><br><br>

    <label>Telefone fixo:</label>
    <input type="tel" name="telefone"><br><br>

    <label>Celular A:</label>
    <input type="tel" name="celularA">
    <label>Celular B:</label>
    <input type="tel" name="celularB"><br><br>

    <label>E-mail:</label>
    <input type="email" name="email"><br><br>

   
</form>
<h2>CURSO PRETENDIDO:</h2>

<div class="opcoes">
    <label>
        <input type="checkbox" name="curso" value="TI">
        Técnico em Desenvolvimento de Sistemas (Integrado ao Ensino Médio) – Turno da Manhã
    </label><br>

    <label>
        <input type="checkbox" name="curso" value="Formacao">
      Formação de Docentes (Integrado ao Ensino Médio) – Turno da Manhã
    </label><br>
    </label>
</div>

</body>
</html>
